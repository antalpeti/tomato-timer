# =============================================================================
# Java Util Logging configuration for Tomato Timer
# Pass to the JVM with: -Djava.util.logging.config.file=logging.properties
# =============================================================================

# --- Root logger ----------------------------------------------------------
# Keep the global default level at INFO so unrelated libraries stay quiet.
.level = INFO

# --- Handlers attached to the root logger ---------------------------------
# Route log records to the console (System.err by default).
handlers = java.util.logging.ConsoleHandler

# --- Console handler configuration ----------------------------------------
# The handler itself must be open to FINE, otherwise it drops records before
# the per-logger level has any effect.
java.util.logging.ConsoleHandler.level     = FINE
java.util.logging.ConsoleHandler.formatter = java.util.logging.SimpleFormatter

# Human-readable one-line format: date/time  level  logger  message
java.util.logging.SimpleFormatter.format = %1$tF %1$tT  %-7s  [%3$s]  %5$s%6$s%n

# --- Per-class logger overrides -------------------------------------------
# Enable FINE (debug) output specifically for WindowsNativeWindowIconHelper.
# All other com.tomatotimer classes remain at the root INFO level.
com.tomatotimer.WindowsNativeWindowIconHelper.level = FINE

